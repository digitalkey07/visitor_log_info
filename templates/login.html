<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/login.css')}}">

</head>

<body>
    <div class="login-box">
        <h2>Login</h2>
        <p class="subtitle">Login to your dashboard</p>

        <form action="/login" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username"
                required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password"
                autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <p class="footer">Visitor Tracking System</p>
    </div>

</body>
<script>
    document.querySelector("form").addEventListener('submit', async function (e) {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (username.length < 3 || username.length > 50) {
            alert("Username must be between 3 and 50 characters.");
            e.preventDefault();
        } else if (password.length < 8) {
            alert("Password must be at least 8 characters.");
            e.preventDefault();
        }
        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ "username": username, "password": password })
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.error);
                e.preventDefault();
            } else {
                const token = data.token;
                localStorage.setItem("token", token);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred. Please try again.");
        }

    })
</script>

</html>
