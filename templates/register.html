<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Visitor Tracking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>
    <div class="register-box">
        <h2>Create Account</h2>
        <p class="subtitle">Register for Visitor Tracking</p>

        {% if error %}
        <p class="message">{{ error }}</p>
        {% endif %}

        <form action="/register" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username"
                minlength="3" maxlength="50" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create password"
                autocomplete="new-password" minlength="8" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password"
                autocomplete="new-password" minlength="8" required>

            <button type="submit" id="register_btn">Register</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>

</body>

<script>
    const registerForm = document.querySelector("form");

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm_password");
    const registerBtn = document.getElementById("register_btn");

    registerForm.addEventListener("submit", async function (e) {
        // Normal form submission roko
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        console.log("userName: " + username);
        console.log("password: " + password);


        // Purana validation message clear karo
        confirmPasswordInput.setCustomValidity("");

        // Password match check
        if (password !== confirmPassword) {
            confirmPasswordInput.setCustomValidity(
                "Passwords do not match."
            );

            confirmPasswordInput.reportValidity();
            confirmPasswordInput.focus();
            return;
        }

        try {
            registerBtn.disabled = true;
            registerBtn.textContent = "Registering...";

            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();
            console.log(response);

            if (response.ok) {
                window.location.href = "/login";
            } else {
                alert(data.error || "Registration failed.");
            }

        } catch (error) {
            console.error("Registration error:", error);
            alert("Server se connection nahi ho paya. Please try again.");

        } finally {
            registerBtn.disabled = false;
            registerBtn.textContent = "Register";
        }
    });
</script>

</html>
