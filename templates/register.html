<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Visitor Tracking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>
    <div class="register-box">
        <h2>Create Account</h2>
        <p class="subtitle">Register for Visitor Tracking</p>

        {% if error %}
        <p class="message">{{ error }}</p>
        {% endif %}

        <form action="/register" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username"
                minlength="3" maxlength="50" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create password"
                autocomplete="new-password" minlength="8" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password"
                autocomplete="new-password" minlength="8" required>

            <button type="submit" id="register_btn">Register</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>

</body>
<script>
    const registerForm = document.querySelector('form');
    registerForm.addEventListener('submit', async function (e) {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirmPassword = document.getElementById('confirm_password').value.trim();
        if (password != confirmPassword) {
            confirmPassword.error = "Passwords do not match.";
            confirmPassword.focus();
        } else {
            try {
                fetch('/register', {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ "username": username, "password": password })
                }).then((response) => {
                    if (response.ok) {
                        window.location.href = "/login";
                    } else {
                        response.json().then((data) => {
                            alert(data.error);
                        });
                    }
                });



            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred. Please try again.");
            }
        }

    })
</script>

</html>
